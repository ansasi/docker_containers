name: Lint Compose Files

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: docker:29.8-cli
    env:
      # Placeholders used only while interpolating Compose files for linting.
      # No services are started by this workflow.
      DOMAIN: example.invalid
      NAS_STORAGE_LOCATION: /mnt/ci-nas
      NTFY_URL: https://ntfy.invalid/compose-lint-placeholder
      PBS_API_TOKEN: compose-lint-placeholder
      PBS_API_TOKEN_NAME: compose-lint-placeholder
      PBS_USERNAME: ci@pbs
      PIHOLE_WEB_PASSWORD: compose-lint-placeholder
      PVE_TOKEN_NAME: compose-lint-placeholder
      PVE_TOKEN_VALUE: compose-lint-placeholder
      PVE_USER: ci@pve
      TRAEFIK_DASHBOARD_CREDENTIALS: ci:compose-lint-placeholder
      WORKDIR: /home/ci-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose files
        run: |
          set -euo pipefail

          files="$(find docker-apps -type f -name docker-compose.yaml | sort)"
          if [ -z "$files" ]; then
            echo "No docker-compose.yaml files found" >&2
            exit 1
          fi

          printf '%s\n' "$files" | while IFS= read -r file; do
            echo "################"
            echo "Validating $file"
            echo "################"
            docker compose -f "$file" config --quiet
          done
