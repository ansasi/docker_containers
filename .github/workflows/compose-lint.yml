name: Lint Compose Files

on:
  pull_request:

jobs:
  compose-lint:
    runs-on: ubuntu-latest
    container:
      image: docker:29.7-cli
    env:
      # Placeholders used only while interpolating Compose files for linting.
      # No services are started by this workflow.
      PIHOLE_WEB_PASSWORD: compose-lint-placeholder
      WORKDIR: /home/ci-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose files
        run: |
          set -euo pipefail
          for file in $(find docker-apps -name docker-compose.yaml); do
            echo "################"
            echo "Validating $file"
            echo "################"
            docker compose -f "$file" config > /dev/null
          done
