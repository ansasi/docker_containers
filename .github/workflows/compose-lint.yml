name: Lint Compose Files

on:
  pull_request:

jobs:
  compose-lint:
    runs-on: ubuntu-latest
    container:
      image: docker:29.6-cli
    env:
      # Placeholder so files that use ${WORKDIR} directly as a volume source
      # (not just ${WORKDIR}/<subpath>) still get a valid, non-empty path.
      WORKDIR: /home/ci-lint
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Validate Compose files
        run: |
          set -euo pipefail
          for file in $(find docker-apps -name docker-compose.yaml); do
            echo "################"
            echo "Validating $file"
            echo "################"
            docker compose -f "$file" config > /dev/null
          done
