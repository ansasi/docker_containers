networks:
  grafana-monitoring:
  proxy:
    external: true

volumes:
  prometheus:
  alertmanager:

# ntfy.sh topic URL (e.g. https://ntfy.sh/<long-random-topic>). Treat it as a
# secret: anyone who knows the topic can read the alerts. Mounted into
# Alertmanager as /run/secrets/ntfy_url (see config/alertmanager.yml).
secrets:
  ntfy_url:
    environment: NTFY_URL

services:
  # TODO: Logs (Loki + Grafana Alloy) are on the roadmap, see TODO.md.

# --- Grafana Image
  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    volumes:
      - ${WORKDIR}/data:/var/lib/grafana
      # Data sources and dashboards from git, see config/grafana/. Only these
      # two provisioning folders are replaced; the image's others stay.
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - grafana-monitoring
      - proxy
    # ports:
    #   # Web Interface (using traefik)
    #   - "8164:3000"
    user: '${PUID}:${PGID}'
    labels:
      # Traefik labels
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.grafana.entrypoints=http
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.middlewares.grafana-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.grafana.middlewares=grafana-https-redirect
      - traefik.http.routers.grafana-secure.entrypoints=https
      - traefik.http.routers.grafana-secure.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana-secure.tls=true
      - traefik.http.routers.grafana-secure.tls.certresolver=cloudflare
      - traefik.http.routers.grafana-secure.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    restart: unless-stopped

# --- Prometheus Image
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    command:
      - '--config.file=/etc/config/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      # Accept metrics pushed by vmagent on the always-on Raspberry Pis
      # (homelab repo, ansible/roles/vmagent): they keep collecting while this
      # stack is off and send the backlog when it is back.
      - '--web.enable-remote-write-receiver'
      # Used for the links in alert notifications.
      - '--web.external-url=https://prometheus.${DOMAIN}'
    # ports:
    #   - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/config/prometheus.yml:ro
      - ./config/rules:/etc/config/rules:ro
      - prometheus:/prometheus
    networks:
      - grafana-monitoring
      - proxy
    labels:
      # Traefik labels
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.prometheus.entrypoints=http
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)
      - traefik.http.middlewares.prometheus-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.prometheus.middlewares=prometheus-https-redirect
      - traefik.http.routers.prometheus-secure.entrypoints=https
      - traefik.http.routers.prometheus-secure.rule=Host(`prometheus.${DOMAIN}`)
      - traefik.http.routers.prometheus-secure.tls=true
      - traefik.http.routers.prometheus-secure.tls.certresolver=cloudflare
      - traefik.http.routers.prometheus-secure.service=prometheus
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      # Remote write (/api/v1/write) only from the Raspberry Pis: dns1
      # (192.168.178.10) and rpi4 (192.168.178.15). Anyone else gets 403, so no
      # other device can push fake metrics. This router's longer rule takes
      # priority over prometheus-secure. If a Pi's address changes, update
      # sourcerange. See README.md, "Who can push: the allow-list".
      - traefik.http.routers.prometheus-write.entrypoints=https
      - traefik.http.routers.prometheus-write.rule=Host(`prometheus.${DOMAIN}`) && Path(`/api/v1/write`)
      - traefik.http.routers.prometheus-write.tls=true
      - traefik.http.routers.prometheus-write.tls.certresolver=cloudflare
      - traefik.http.routers.prometheus-write.service=prometheus
      - traefik.http.routers.prometheus-write.middlewares=prometheus-write-allowlist
      - traefik.http.middlewares.prometheus-write-allowlist.ipallowlist.sourcerange=192.168.178.10/32,192.168.178.15/32
    restart: unless-stopped

# --- Alertmanager Image
  # Routes alerts from Prometheus to ntfy.sh. The web UI is used to create
  # silences (e.g. during maintenance).
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alertmanager.${DOMAIN}'
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    secrets:
      - ntfy_url
    networks:
      - grafana-monitoring
      - proxy
    labels:
      # Traefik labels
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.alertmanager.entrypoints=http
      - traefik.http.routers.alertmanager.rule=Host(`alertmanager.${DOMAIN}`)
      - traefik.http.middlewares.alertmanager-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.alertmanager.middlewares=alertmanager-https-redirect
      - traefik.http.routers.alertmanager-secure.entrypoints=https
      - traefik.http.routers.alertmanager-secure.rule=Host(`alertmanager.${DOMAIN}`)
      - traefik.http.routers.alertmanager-secure.tls=true
      - traefik.http.routers.alertmanager-secure.tls.certresolver=cloudflare
      - traefik.http.routers.alertmanager-secure.service=alertmanager
      - traefik.http.services.alertmanager.loadbalancer.server.port=9093
    restart: unless-stopped

# --- cAdvisor Image
  # Container metrics for the Docker host this stack runs on. Volumes follow
  # the upstream docs (docs/running.md).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      # Do not turn every Docker label (e.g. all Traefik labels) into a
      # Prometheus label.
      - '--store_container_labels=false'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    # Reading /dev/kmsg (container OOM events) needs CAP_SYSLOG when the host
    # restricts dmesg (Debian/Ubuntu default).
    cap_add:
      - SYSLOG
    networks:
      - grafana-monitoring
    restart: unless-stopped

# --- Proxmox VE exporter Image
  # Reads the Proxmox VE API with a read-only (PVEAuditor) API token.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.10.0
    container_name: pve-exporter
    environment:
      PVE_USER: '${PVE_USER:?Set PVE_USER (e.g. prometheus@pve)}'
      PVE_TOKEN_NAME: '${PVE_TOKEN_NAME:?Set PVE_TOKEN_NAME}'
      PVE_TOKEN_VALUE: '${PVE_TOKEN_VALUE:?Set PVE_TOKEN_VALUE}'
      # Proxmox uses its self-signed certificate by default.
      PVE_VERIFY_SSL: 'false'
    networks:
      - grafana-monitoring
    restart: unless-stopped

# --- Proxmox Backup Server exporter Image
  # Reads the PBS API with a read-only (Audit) API token.
  pbs-exporter:
    image: ghcr.io/natrontech/pbs-exporter:v0.9.4
    container_name: pbs-exporter
    user: '65534'
    environment:
      PBS_ENDPOINT: 'https://192.168.178.30:8007'
      PBS_USERNAME: '${PBS_USERNAME:?Set PBS_USERNAME (e.g. prometheus@pbs)}'
      PBS_API_TOKEN_NAME: '${PBS_API_TOKEN_NAME:?Set PBS_API_TOKEN_NAME}'
      PBS_API_TOKEN: '${PBS_API_TOKEN:?Set PBS_API_TOKEN}'
      # PBS uses its self-signed certificate by default.
      PBS_INSECURE: 'true'
    networks:
      - grafana-monitoring
    restart: unless-stopped
