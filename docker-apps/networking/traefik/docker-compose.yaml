---
networks:
  proxy:
    external: true

# Traefik's static configuration. It lives here instead of a separate file so
# Compose can fill in the ACME email from the environment: Traefik cannot read
# environment variables inside its configuration file.
configs:
  traefik-static:
    content: |
      global:
        checkNewVersion: false
        sendAnonymousUsage: false

      log:
        level: INFO

      api:
        dashboard: true

      entryPoints:
        http:
          address: ":80"
          http:
            # middlewares:
            #   - ip-allowlist@file
            redirections:
              entryPoint:
                to: https
                scheme: https
          transport:
            respondingTimeouts:
              readTimeout: 0s
        https:
          address: ":443"
          # http:
          #   middlewares:
          #     - ip-allowlist@file
          transport:
            respondingTimeouts:
              readTimeout: 0s

      certificatesResolvers:
        cloudflare:
          acme:
            email: ${CF_API_EMAIL:?Set the CF_API_EMAIL environment variable in your .env file.}
            storage: /etc/traefik/certs/cloudflare-acme.json
            caServer: 'https://acme-v02.api.letsencrypt.org/directory' # prod (default)
            # caServer: 'https://acme-staging-v02.api.letsencrypt.org/directory' # staging
            dnsChallenge:
              provider: cloudflare
              resolvers:
                - 1.1.1.1:53
                - 1.0.0.1:53

      # serversTransport:
      #   insecureSkipVerify: true

      providers:
        docker:
          endpoint: "unix:///var/run/docker.sock"
          exposedByDefault: false
          watch: true
        file:
          directory: /etc/traefik/config
          watch: true

services:
  traefik:
    image: traefik:v3.7.14
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_DNS_API_TOKEN: '${CF_DNS_API_TOKEN}'
      CF_API_EMAIL: '${CF_API_EMAIL}'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - ./traefik-config/config.yml:/etc/traefik/config/config.yml # In case we need some pre-configuration that we cannot create with labels.
      - ./certs:/etc/traefik/certs/
    configs:
      - source: traefik-static
        target: /etc/traefik/traefik.yml
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.entrypoints=http
      - traefik.http.routers.traefik.rule=Host(`traefik-dashboard.${DOMAIN}`)
      - traefik.http.routers.traefik.tls=true
      - traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.traefik.middlewares=traefik-https-redirect
      - traefik.http.routers.traefik-secure.entrypoints=https
      - traefik.http.routers.traefik-secure.rule=Host(`traefik-dashboard.${DOMAIN}`)
      - traefik.http.routers.traefik-secure.tls=true
      - traefik.http.routers.traefik-secure.tls.certresolver=cloudflare
      - traefik.http.routers.traefik-secure.tls.domains[0].main=${DOMAIN} # if you use the .home.yourdomain.co.uk entry you have to change the [0] into [1]
      - traefik.http.routers.traefik-secure.tls.domains[0].sans=*.${DOMAIN} # same here, change 0 to 1
      - traefik.http.routers.traefik-secure.service=api@internal
      # Dashboard Authentication
      - traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_CREDENTIALS:?Set the TRAEFIK_DASHBOARD_CREDENTIALS environment variable in your .env file.}
      - traefik.http.routers.traefik-secure.middlewares=traefik-dashboard-auth
    restart: unless-stopped
