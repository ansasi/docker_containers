http:
  middlewares:
    crowdsec-bouncer:
      plugin:
        bouncer:
          enabled: true
          crowdsecMode: stream
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec:8080
          # Resolved by Traefik's file-provider Go templating from the
          # container environment (CROWDSEC_BOUNCER_API_KEY in this stack's
          # .env). Must match the key in the crowdsec stack's .env
          # (docker-apps/security/crowdsec) — generate with:
          #   openssl rand -hex 32
          crowdsecLapiKey: '{{ env "CROWDSEC_BOUNCER_API_KEY" }}'
