networks:
  pihole_internal:
    ipam:
      config:
        - subnet: 172.30.9.0/29
  # Uncomment if this Pi later joins a Docker network managed by Traefik.
  # proxy:
  #   external: true

services:
  # Lightweight encrypted-DNS forwarder, so ISP can't see your DNS queries.
  # Pi-hole sends ordinary DNS only over this private Docker network; dnsproxy sends it upstream using HTTPS.
  dnsproxy:
    container_name: dnsproxy
    image: adguard/dnsproxy:v0.84.1
    command:
      - --listen=0.0.0.0
      - --port=5053
      - --upstream=https://1.1.1.1/dns-query
      - --upstream=https://1.0.0.1/dns-query
      - --upstream-mode=load_balance
      - --timeout=10s
    networks:
      pihole_internal:
        ipv4_address: 172.30.9.2
    security_opt:
      - no-new-privileges:true
    read_only: true
    restart: unless-stopped

  pihole:
    container_name: pihole
    image: pihole/pihole:2026.07.2
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "67:67/udp" DHCP - uncomment if using it
      # Pi-hole web interface (no Traefik on this host).
      - "80:80/tcp" # TODO: Comment it if Traefik is used
    networks:
      pihole_internal:
        ipv4_address: 172.30.9.3
      # Uncomment together with the proxy network and Traefik labels below.
      # proxy:
    environment:
      TZ: Europe/Madrid
      FTLCONF_webserver_api_password: "${PIHOLE_WEB_PASSWORD:?Set PIHOLE_WEB_PASSWORD in .env}"
      # Required for Pi-hole in Docker bridge networking.  Port 53 must never
      # be forwarded by the router from the Internet.
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: 172.30.9.2#5053
    volumes:
      - ${WORKDIR:?Set WORKDIR in .env}/etc-pihole:/etc/pihole
      # Pi-hole v6 does not need /etc/dnsmasq.d unless you use custom files.
      # If needed, uncomment this mount and set
      # FTLCONF_misc_etc_dnsmasq_d: "true" above.
      # - ${WORKDIR:?Set WORKDIR in .env}/etc-dnsmasq.d:/etc/dnsmasq.d
    # Traefik is not installed on this Raspberry Pi. Keep these commented for
    # possible future use together with the proxy network above.
    # labels:
    #   traefik.enable: "true"
    #   traefik.docker.network: proxy
    #   traefik.http.routers.pihole.entrypoints: http
    #   traefik.http.routers.pihole.rule: "Host(`pihole.${DOMAIN}`)"
    #   traefik.http.routers.pihole.middlewares: pihole-https-redirect
    #   traefik.http.middlewares.pihole-https-redirect.redirectscheme.scheme: https
    #   traefik.http.routers.pihole-secure.entrypoints: https
    #   traefik.http.routers.pihole-secure.rule: "Host(`pihole.${DOMAIN}`)"
    #   traefik.http.routers.pihole-secure.tls: "true"
    #   traefik.http.routers.pihole-secure.service: pihole
    #   traefik.http.services.pihole.loadbalancer.server.port: "80"
    depends_on:
      dnsproxy:
        condition: service_started
    restart: unless-stopped
